<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --accent: #6c5ce7;
            --text: #e0e0e0;
            --danger: #ff6b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--bg-secondary);
            position: relative;
        }

        .back-button {
            position: absolute;
            left: 0;
            background: var(--bg-secondary);
            color: var(--text);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .back-button:hover {
            opacity: 0.8;
        }

        .header-content {
            flex-grow: 1;
            text-align: center;
        }

        .search-container {
            margin: 0 auto 2rem auto;
            max-width: 600px;
            width: 100%;
        }

        .search-bar {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border: 2px solid var(--bg-secondary);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-bar::placeholder {
            color: #666;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .user-card {
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 1.5rem;
            transition: transform 0.2s;
        }

        .user-card:hover {
            transform: translateY(-5px);
        }

        .user-info {
            margin-bottom: 1rem;
        }

        .user-info p {
            margin: 0.5rem 0;
            color: #a0a0a0;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-top: 1px solid #3d3d3d;
        }

        .button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .button:hover {
            opacity: 0.9;
        }

        .button-danger {
            background: var(--danger);
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .modal-button {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .confirm-button {
            background: var(--danger);
            color: white;
        }

        .cancel-button {
            background: #4a4a4a;
            color: white;
        }

        /* New styles for tabs */
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            width: 100%;
        }

        .tab-button {
            background: var(--bg-secondary);
            color: var(--text);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .tab-button.active {
            background: var(--accent);
        }

        .tab-content {
            display: none;
            width: 100%;
        }

        .tab-content.active {
            display: block;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            width: 100%;
            gap: 1rem;
        }

        .add-button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-button:hover {
            opacity: 0.9;
        }

        .modal-content input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            margin-bottom: 1rem;
            border: 2px solid var(--bg-secondary);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text);
            font-size: 1rem;
        }

        .modal-content input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-select {
            width: 100%;
            padding: 0.8rem 1.2rem;
            margin-bottom: 1rem;
            border: 2px solid var(--bg-secondary);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text);
            font-size: 1rem;
        }

        .modal-select:focus {
            outline: none;
            border-color: var(--accent);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <button class="back-button" onclick="window.history.back()">← Back</button>
        <div class="header-content">
            <h1>Admin Dashboard</h1>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-button active" onclick="switchTab('users', event)">Users</button>
        <button class="tab-button" onclick="switchTab('resources', event)">Resources</button>
        <button class="tab-button" onclick="switchTab('equipment', event)">Equipment</button>
    </div>

    <!-- Users Tab -->
    <div id="users-tab" class="tab-content active">
        <div class="search-container">
            <input type="text"
                   class="search-bar"
                   placeholder="Search users..."
                   id="searchInput"
                   oninput="searchUsers()">
        </div>

        <div class="gallery">
            <!-- Existing user cards -->
            <div class="user-card">
                <div class="user-info">
                    <h3>John Doe</h3>
                    <p>john.doe@example.com</p>
                    <p>Permission Level: Admin</p>
                </div>
                <div class="stats">
                    <span>Submissions: 15</span>
                </div>
                <button class="button button-danger" onclick="showConfirmDialog(1)">Remove Account</button>
            </div>
        </div>
    </div>

    <!-- Resources Tab -->
    <div id="resources-tab" class="tab-content">
        <div class="section-header">
            <div class="search-container">
                <input type="text"
                       class="search-bar"
                       placeholder="Search resources..."
                       id="resourceSearchInput"
                       oninput="searchResources()">
            </div>
            <button class="add-button" onclick="showResourceModal()">
                <span>+</span> Add Resource
            </button>
        </div>

        <div class="gallery" id="resources-gallery">
            <!-- Resource cards will be added here -->
            <div class="user-card">
                <div class="user-info">
                    <h3>Resource 1</h3>
                    <p>ID: RSC001</p>
                </div>
                <button class="button button-danger" onclick="showConfirmDialog('RSC001')">Remove Resource</button>
            </div>
        </div>
    </div>
    <!-- Equipment Tab -->
    <div id="equipment-tab" class="tab-content">
        <div class="section-header">
            <div class="search-container">
                <input type="text"
                       class="search-bar"
                       placeholder="Search equipment..."
                       id="equipmentSearchInput"
                       oninput="searchEquipment()">
            </div>
            <button class="add-button" onclick="showEquipmentModal()">
                <span>+</span> Add Equipment
            </button>
        </div>

        <div class="gallery" id="equipment-gallery">
            <!-- Equipment cards will be added here -->
            <div class="user-card">
                <div class="user-info">
                    <h3>Equipment 1</h3>
                    <p>ID: EQP001</p>
                    <p>Status: Available</p>
                </div>
                <button class="button button-danger" onclick="showConfirmDialog('EQP001')">Remove Equipment</button>
            </div>
        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal" id="confirmModal">
    <div class="modal-content">
        <h2>Are you sure?</h2>
        <p>This action cannot be undone.</p>
        <div class="modal-buttons">
            <button class="modal-button cancel-button" onclick="hideConfirmDialog()">Cancel</button>
            <button class="modal-button confirm-button" onclick="confirmDelete()">Confirm</button>
        </div>
    </div>
</div>

<!-- Resource Modal -->
<div class="modal" id="resourceModal">
    <div class="modal-content">
        <h2>Add New Resource</h2>
        <input type="text" id="resourceName" placeholder="Resource Name">
        <input type="text" id="resourceId" placeholder="ID Number">
        <div class="modal-buttons">
            <button class="modal-button cancel-button" onclick="hideResourceModal()">Cancel</button>
            <button class="modal-button confirm-button" onclick="addResource()">Add</button>
        </div>
    </div>
</div>

<!-- Equipment Modal -->
<div class="modal" id="equipmentModal">
    <div class="modal-content">
        <h2>Add New Equipment</h2>
        <input type="text" id="equipmentName" placeholder="Equipment Name">
        <input type="text" id="equipmentId" placeholder="ID Number">
        <select id="equipmentStatus" class="modal-select">
            <option value="Available">Available</option>
            <option value="In Use">In Use</option>
            <option value="Maintenance">Maintenance</option>
        </select>
        <div class="modal-buttons">
            <button class="modal-button cancel-button" onclick="hideEquipmentModal()">Cancel</button>
            <button class="modal-button confirm-button" onclick="addEquipment()">Add</button>
        </div>
    </div>
</div>

<script>
    let currentUserId = null;

    function showConfirmDialog(userId) {
        currentUserId = userId;
        document.getElementById('confirmModal').style.display = 'flex';
    }

    function hideConfirmDialog() {
        document.getElementById('confirmModal').style.display = 'none';
    }

    function confirmDelete() {
        console.log(`Deleting user ${currentUserId}`);
        hideConfirmDialog();
    }

    function searchUsers() {
        const searchValue = document.getElementById('searchInput').value.toLowerCase();
        const userCards = document.querySelectorAll('#users-tab .user-card');

        userCards.forEach(card => {
            const userInfo = card.querySelector('.user-info').textContent.toLowerCase();
            if (userInfo.includes(searchValue)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    function switchTab(tabName, event) {
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active');
        });

        document.querySelectorAll('.tab-button').forEach(button => {
            button.classList.remove('active');
        });

        document.getElementById(`${tabName}-tab`).classList.add('active');

        if (event && event.currentTarget) {
            event.currentTarget.classList.add('active');
        }
    }

    function showResourceModal() {
        document.getElementById('resourceModal').style.display = 'flex';
    }

    function hideResourceModal() {
        document.getElementById('resourceModal').style.display = 'none';
    }

    function searchResources() {
        const searchValue = document.getElementById('resourceSearchInput').value.toLowerCase();
        const resourceCards = document.querySelectorAll('#resources-gallery .user-card');

        resourceCards.forEach(card => {
            const resourceInfo = card.querySelector('.user-info').textContent.toLowerCase();
            if (resourceInfo.includes(searchValue)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    function addResource() {
        const name = document.getElementById('resourceName').value;
        const id = document.getElementById('resourceId').value;

        if (!name || !id) {
            alert('Please fill in all fields');
            return;
        }

        const resourceHtml = `
                <div class="user-card">
                    <div class="user-info">
                        <h3>${name}</h3>
                        <p>ID: ${id}</p>
                    </div>
                    <button class="button button-danger" onclick="showConfirmDialog('${id}')">Remove Resource</button>
                </div>
            `;

        document.getElementById('resources-gallery').insertAdjacentHTML('beforeend', resourceHtml);
        hideResourceModal();

        // Clear inputs
        document.getElementById('resourceName').value = '';
        document.getElementById('resourceId').value = '';
    }

    function showEquipmentModal() {
        document.getElementById('equipmentModal').style.display = 'flex';
    }

    function hideEquipmentModal() {
        document.getElementById('equipmentModal').style.display = 'none';
    }

    function searchEquipment() {
        const searchValue = document.getElementById('equipmentSearchInput').value.toLowerCase();
        const equipmentCards = document.querySelectorAll('#equipment-gallery .user-card');

        equipmentCards.forEach(card => {
            const equipmentInfo = card.querySelector('.user-info').textContent.toLowerCase();
            if (equipmentInfo.includes(searchValue)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    function addEquipment() {
        const name = document.getElementById('equipmentName').value;
        const id = document.getElementById('equipmentId').value;
        const status = document.getElementById('equipmentStatus').value;

        if (!name || !id) {
            alert('Please fill in all fields');
            return;
        }

        const equipmentHtml = `
                <div class="user-card">
                    <div class="user-info">
                        <h3>${name}</h3>
                        <p>ID: ${id}</p>
                        <p>Status: ${status}</p>
                    </div>
                    <button class="button button-danger" onclick="showConfirmDialog('${id}')">Remove Equipment</button>
                </div>
            `;

        document.getElementById('equipment-gallery').insertAdjacentHTML('beforeend', equipmentHtml);
        hideEquipmentModal();

        // Clear inputs
        document.getElementById('equipmentName').value = '';
        document.getElementById('equipmentId').value = '';
        document.getElementById('equipmentStatus').value = 'Available';
    }
</script>
</body>
</html>
