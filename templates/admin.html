<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --accent: #6c5ce7;
            --text: #e0e0e0;
            --danger: #ff6b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--bg-secondary);
            position: relative;
        }

        .back-button {
            position: absolute;
            left: 0;
            background: var(--bg-secondary);
            color: var(--text);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .back-button:hover {
            opacity: 0.8;
        }

        .header-content {
            flex-grow: 1;
            text-align: center;
        }

        .search-container {
            margin: 0 auto 2rem auto;
            max-width: 600px;
        }

        .search-bar {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border: 2px solid var(--bg-secondary);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-bar::placeholder {
            color: #666;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .user-card {
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 1.5rem;
            transition: transform 0.2s;
        }

        .user-card:hover {
            transform: translateY(-5px);
        }

        .user-info {
            margin-bottom: 1rem;
        }

        .user-info p {
            margin: 0.5rem 0;
            color: #a0a0a0;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-top: 1px solid #3d3d3d;
        }

        .button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .button:hover {
            opacity: 0.9;
        }

        .button-danger {
            background: var(--danger);
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .modal-button {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .confirm-button {
            background: var(--danger);
            color: white;
        }

        .cancel-button {
            background: #4a4a4a;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <button class="back-button" onclick="window.history.back()">← Back</button>
        <div class="header-content">
            <h1>Admin Dashboard</h1>
        </div>
    </div>
    
    <div class="search-container">
        <input type="text" 
               class="search-bar" 
               placeholder="Search users..." 
               id="searchInput" 
               oninput="searchUsers()">
    </div>

    <div class="gallery">
        <!-- Placeholder user cards -->
        <div class="user-card">
            <div class="user-info">
                <h3>John Doe</h3>
                <p>john.doe@example.com</p>
                <p>Permission Level: Admin</p>
            </div>
            <div class="stats">
                <span>Submissions: 15</span>
            </div>
            <button class="button button-danger" onclick="showConfirmDialog(1)">Remove Account</button>
        </div>

        <!-- Add more placeholder cards as needed -->
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal" id="confirmModal">
    <div class="modal-content">
        <h2>Are you sure?</h2>
        <p>This action cannot be undone.</p>
        <div class="modal-buttons">
            <button class="modal-button cancel-button" onclick="hideConfirmDialog()">Cancel</button>
            <button class="modal-button confirm-button" onclick="confirmDelete()">Confirm</button>
        </div>
    </div>
</div>

<script>
    let currentUserId = null;

    function showConfirmDialog(userId) {
        currentUserId = userId;
        document.getElementById('confirmModal').style.display = 'flex';
    }

    function hideConfirmDialog() {
        document.getElementById('confirmModal').style.display = 'none';
    }

    function confirmDelete() {
        // Here you'll add the logic to delete the user
        console.log(`Deleting user ${currentUserId}`);
        hideConfirmDialog();
    }

    function searchUsers() {
        const searchValue = document.getElementById('searchInput').value.toLowerCase();
        const userCards = document.querySelectorAll('.user-card');

        userCards.forEach(card => {
            const userInfo = card.querySelector('.user-info').textContent.toLowerCase();
            if (userInfo.includes(searchValue)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }
</script>
</body>
</html>
