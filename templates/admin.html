<!DOCTYPE html>
<html lang="en">
<!-- Head section remains exactly the same until the body tag -->
<body>
<div class="container">
    <div class="header">
        <button class="back-button" onclick="window.history.back()">← Back</button>
        <div class="header-content">
            <h1>Admin Dashboard</h1>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-button active" onclick="switchTab('users', event)">Users</button>
        <button class="tab-button" onclick="switchTab('resources', event)">Resources</button>
        <button class="tab-button" onclick="switchTab('equipment', event)">Equipment</button>
        <button class="tab-button" onclick="switchTab('locations', event)">Locations</button>
    </div>

    <!-- Users Tab content remains the same -->

    <!-- Resources Tab content remains the same -->

    <!-- Equipment Tab content remains the same -->

    <!-- Locations Tab - Moved inside container -->
    <div id="locations-tab" class="tab-content">
        <div class="section-header">
            <div class="search-container">
                <input type="text"
                       class="search-bar"
                       placeholder="Search locations..."
                       id="locationSearchInput"
                       oninput="searchLocations()">
            </div>
            <button class="add-button" id="addLocationButton">
                <span>+</span> Add Location
            </button>
        </div>

        <div class="gallery" id="locations-gallery">
            {% for location in locations %}
                <div class="user-card">
                    <div class="user-info">
                        <h3>{{ location.site_name }}</h3>
                        <p>Address: {{ location.address_line_1 }}</p>
                        <p>Post Code: {{ location.post_code }}</p>
                        <p>what3words: {{ location.what3words }}</p>
                    </div>
                    <form method="post" action="{{ url_for('delete_location', location_id=location.id) }}" style="margin:0;">
                        <button class="button button-danger" type="submit" onclick="return confirm('Are you sure you want to remove this location?')">Remove Location</button>
                    </form>
                </div>
            {% endfor %}
        </div>
    </div>
</div>

<!-- All modals remain the same -->

<script>
    // Tab switching function remains the same
    function switchTab(tab, evt) {
        document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(e => e.classList.remove('active'));
        document.getElementById(tab + '-tab').classList.add('active');
        if (evt) evt.target.classList.add('active');
        else document.querySelector(`.tab-button[onclick*="${tab}"]`).classList.add('active');
    }

    // Search functions
    function searchUsers() {
        const val = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('#users-gallery .user-card').forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(val) ? '' : 'none';
        });
    }

    function searchResources() {
        const val = document.getElementById('resourceSearchInput').value.toLowerCase();
        document.querySelectorAll('#resources-gallery .user-card').forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(val) ? '' : 'none';
        });
    }

    function searchEquipment() {
        const val = document.getElementById('equipmentSearchInput').value.toLowerCase();
        document.querySelectorAll('#equipment-gallery .user-card').forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(val) ? '' : 'none';
        });
    }

    function searchLocations() {
        const val = document.getElementById('locationSearchInput').value.toLowerCase();
        document.querySelectorAll('#locations-gallery .user-card').forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(val) ? '' : 'none';
        });
    }

    // Single DOMContentLoaded event listener for all functionality
    document.addEventListener('DOMContentLoaded', function() {
        // Get all modal elements
        const addResourceBtn = document.getElementById('addResourceButton');
        const addResourceModal = document.getElementById('addResourceModal');
        const cancelResourceBtn = document.getElementById('cancelResourceBtn');

        const addEquipmentBtn = document.getElementById('addEquipmentButton');
        const addEquipmentModal = document.getElementById('addEquipmentModal');
        const cancelEquipmentBtn = document.getElementById('cancelEquipmentBtn');

        const addLocationBtn = document.getElementById('addLocationButton');
        const addLocationModal = document.getElementById('addLocationModal');
        const cancelLocationBtn = document.getElementById('cancelLocationBtn');

        // Resource Modal handlers
        if (addResourceBtn && addResourceModal) {
            addResourceBtn.onclick = () => addResourceModal.style.display = 'flex';
            cancelResourceBtn.onclick = () => {
                addResourceModal.style.display = 'none';
                document.getElementById('addResourceForm').reset();
            };
            addResourceModal.addEventListener('click', (e) => {
                if (e.target === addResourceModal) addResourceModal.style.display = 'none';
            });
        }

        // Equipment Modal handlers
        if (addEquipmentBtn && addEquipmentModal) {
            addEquipmentBtn.onclick = () => addEquipmentModal.style.display = 'flex';
            cancelEquipmentBtn.onclick = () => {
                addEquipmentModal.style.display = 'none';
                document.getElementById('addEquipmentForm').reset();
            };
            addEquipmentModal.addEventListener('click', (e) => {
                if (e.target === addEquipmentModal) addEquipmentModal.style.display = 'none';
            });
        }

        // Location Modal handlers
        if (addLocationBtn && addLocationModal) {
            addLocationBtn.onclick = () => addLocationModal.style.display = 'flex';
            cancelLocationBtn.onclick = () => {
                addLocationModal.style.display = 'none';
                document.getElementById('addLocationForm').reset();
            };
            addLocationModal.addEventListener('click', (e) => {
                if (e.target === addLocationModal) addLocationModal.style.display = 'none';
            });
        }

        // Global escape key handler
        window.addEventListener('keydown', function(evt) {
            if (evt.key === "Escape") {
                addResourceModal.style.display = 'none';
                addEquipmentModal.style.display = 'none';
                addLocationModal.style.display = 'none';
                hideConfirmDialog();
            }
        });
    });

    function hideConfirmDialog() {
        document.getElementById('confirmModal').style.display = 'none';
    }
</script>
</body>
</html>
