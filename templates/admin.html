<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Keeping your existing dark theme styles */
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            height: 100vh;
            background-color: #2d2d2d;
            padding: 20px;
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
        }

        /* User card styles */
        .user-card {
            background-color: #2d2d2d;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .user-actions {
            display: flex;
            gap: 10px;
        }

        .btn-role {
            background-color: #404040;
            color: #ffffff;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .btn-role.active {
            background-color: #8e9aaf;
        }

        .btn-remove {
            background-color: #dc3545;
            color: #ffffff;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 270px;
            z-index: 1000;
        }

        /* Add user modal styles */
        .modal-content {
            background-color: #2d2d2d;
            color: #ffffff;
        }

        .modal-header {
            border-bottom: 1px solid #404040;
        }

        .modal-footer {
            border-top: 1px solid #404040;
        }

        .form-control {
            background-color: #404040;
            border: none;
            color: #ffffff;
        }

        .form-control:focus {
            background-color: #404040;
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(142, 154, 175, 0.25);
        }
    </style>
</head>
<body>
    <!-- Back Button -->
    <a href="dashboard.html" class="btn btn-outline-light back-button">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>

    <!-- Sidebar -->
    <div class="sidebar">
        <h3 class="mb-4">Admin Panel</h3>
        <div class="list-group">
            <a href="#" class="list-group-item list-group-item-action active">
                <i class="bi bi-people me-2"></i>User Management
            </a>
            <a href="#" class="list-group-item list-group-item-action">
                <i class="bi bi-shield-lock me-2"></i>Roles
            </a>
            <a href="#" class="list-group-item list-group-item-action">
                <i class="bi bi-gear me-2"></i>Settings
            </a>
            <a href="admin.html" class="list-group-item list-group-item-action">
                <i class="bi bi-shield-lock me-2"></i>Admin Panel
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>User Management</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
                <i class="bi bi-person-plus"></i> Add User
            </button>
        </div>

        <!-- User Gallery -->
        <div class="row" id="userGallery">
            <!-- Example User Card -->
            <div class="col-md-6 col-lg-4">
                <div class="user-card">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h5>John Doe</h5>
                            <p class="mb-1"><i class="bi bi-envelope"></i> john.doe@example.com</p>
                        </div>
                        <div class="user-actions">
                            <button class="btn-role active">User</button>
                            <button class="btn-role">Admin</button>
                        </div>
                    </div>
                    <button class="btn-remove w-100">
                        <i class="bi bi-trash"></i> Remove Account
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New User</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addUserForm">
                        <div class="mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select class="form-control">
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="addUserForm" class="btn btn-primary">Add User</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
