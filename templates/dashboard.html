<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            height: 100vh;
            background-color: #2d2d2d;
            padding: 20px;
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
        }

        .card {
            background-color: #2d2d2d;
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .list-group-item {
            background-color: transparent;
            border: none;
            color: #ffffff;
            padding: 12px 20px;
            margin-bottom: 5px;
            border-radius: 10px;
            transition: background-color 0.3s;
        }

        .list-group-item:hover {
            background-color: #404040;
            color: #ffffff;
        }

        .list-group-item.active {
            background-color: #404040;
            border: none;
        }

        .nav-profile {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .profile-dropdown {
            background-color: #2d2d2d;
            border: none;
        }

        .profile-dropdown .dropdown-item {
            color: #ffffff;
        }

        .profile-dropdown .dropdown-item:hover {
            background-color: #404040;
        }

        .stats-card {
            background: linear-gradient(145deg, #2d2d2d, #353535);
            color: #ffffff;
            border-radius: 15px;
            padding: 20px;
        }

        .stats-card .card-title {
            color: #e0e0e0;  /* Lighter text color for titles */
            font-size: 1.1rem;
            font-weight: 500;
        }

        .stats-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;  /* Brighter white for the numbers */
        }

        .card-text {
            color: #d0d0d0 !important;  /* Lighter color for the percentage text */
        }

        .floating-action-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #8e9aaf;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .floating-action-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .tooltip-text {
            position: absolute;
            right: 70px;
            background-color: #2d2d2d;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        .floating-action-btn:hover .tooltip-text {
            opacity: 1;
        }
    </style>
</head>
<body>
<!-- User Profile Dropdown -->
<div class="nav-profile">
    <div class="dropdown">
        <button class="btn btn-dark dropdown-toggle" type="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end profile-dropdown" aria-labelledby="profileDropdown">
            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>My Account</a></li>
            <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
        </ul>
    </div>
</div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 sidebar">
            <h3 class="mb-4">Dashboard</h3>
            <div class="list-group">
                <a href="#" class="list-group-item list-group-item-action active">
                    <i class="bi bi-house-door me-2"></i>Overview
                </a>
                <a href="#" class="list-group-item list-group-item-action">
                    <i class="bi bi-file-text me-2"></i>Reports
                </a>
                <a href="#" class="list-group-item list-group-item-action">
                    <i class="bi bi-graph-up me-2"></i>Analytics
                </a>
                <a href="#" class="list-group-item list-group-item-action">
                    <i class="bi bi-gear me-2"></i>Settings
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 main-content">
            <h2 class="mb-4">Welcome to Your Dashboard</h2>

            <!-- Stats Cards -->
            <div class="row mt-4">
                <div class="col-md-4">
                    <div class="card stats-card mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Total Activities</h5>
                            <p class="stats-value">150</p>
                            <p class="card-text"><i class="bi bi-arrow-up"></i> 12% increase</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stats-card mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Active Projects</h5>
                            <p class="stats-value">12</p>
                            <p class="card-text"><i class="bi bi-arrow-up"></i> 5% increase</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stats-card mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Tasks Completed</h5>
                            <p class="stats-value">45</p>
                            <p class="card-text"><i class="bi bi-arrow-up"></i> 8% increase</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Floating Action Button -->
<div class="floating-action-btn">
    <i class="bi bi-plus-lg"></i>
    <span class="tooltip-text">Submit New Activity</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
